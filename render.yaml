services:
  - type: web
    name: viral-video-radar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TIKHUB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ENABLE_MOCK_MODE
        value: "false"
